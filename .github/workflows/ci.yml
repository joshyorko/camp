name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, race, vet, and vulnerability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race tests
        run: go test -race ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  integration:
    name: Credential-free integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./integration -count=1

  minio:
    name: Mandatory containerized MinIO
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove MinIO tests exist
        run: |
          tests="$(go test ./integration -list '^TestMinIO')"
          grep -q '^TestMinIO' <<<"$tests"
      - name: Run mandatory MinIO matrix
        run: go test -v ./integration -run '^TestMinIO' -count=1

  locked-tools:
    name: Pinned tool bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tools.lock.yaml and bootstrap behavior
        env:
          CAMP_TEST_REAL_TOOLS: "1"
        run: |
          tests="$(go test ./internal/adapters/tools -list '^TestInstallerCleanInstallsRealPinnedTools$')"
          grep -qx 'TestInstallerCleanInstallsRealPinnedTools' <<<"$tests"
          go test -v ./internal/adapters/tools -run '^TestInstallerCleanInstallsRealPinnedTools$' -count=1

  packaging:
    name: Reproducible packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./packaging -count=1
      - name: Build candidate artifacts
        env:
          VERSION: 0.0.0-${{ github.sha }}
          COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: "0"
          OUTPUT_DIR: dist
        run: ./packaging/build-archives.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-free-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  rcc-local:
    name: RCC local candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build exact RCC candidate
        run: ./developer/rccw run -r developer/toolkit.yaml --dev -t local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rcc-candidate-${{ github.sha }}
          path: |
            build/camp
            build/evidence/candidate.json
          if-no-files-found: error
          retention-days: 14

  rcc-test:
    name: RCC source gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify pull request evidence receipt
        if: github.event_name == 'pull_request'
        run: python3 developer/verify_pr_receipt.py "$GITHUB_EVENT_PATH"
      - name: Run RCC source gates
        run: ./developer/rccw run -r developer/toolkit.yaml --dev -t test
      - name: Upload RCC source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rcc-source-evidence-${{ github.sha }}
          path: build/evidence/test-gates.json
          if-no-files-found: error
          retention-days: 30

  rcc-robot:
    name: RCC exact-candidate lifecycle evidence
    needs: rcc-local
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rcc-candidate-${{ github.sha }}
          path: .
      - name: Verify downloaded exact candidate
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          chmod +x build/camp
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          candidate = pathlib.Path("build/camp")
          manifest = json.loads(pathlib.Path("build/evidence/candidate.json").read_text())
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          if manifest.get("commit") != os.environ["CANDIDATE_COMMIT"]:
              raise SystemExit("candidate manifest commit does not match workflow commit")
          if manifest.get("dirty") is not False:
              raise SystemExit("CI candidate must be built from a clean checkout")
          if manifest.get("candidateSha256") != digest:
              raise SystemExit("downloaded candidate digest does not match manifest")
          PY
      - name: Run mandatory exact-candidate Robot lifecycle
        id: robot
        run: ./developer/rccw run -r developer/toolkit.yaml -t robot
      - name: Record RCC Robot cleanup receipt
        if: always()
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          ROBOT_OUTCOME: ${{ steps.robot.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p build/evidence
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          candidate = pathlib.Path("build/camp")
          receipt = {
              "schemaVersion": 1,
              "candidateCommit": os.environ["CANDIDATE_COMMIT"],
              "candidateSha256": hashlib.sha256(candidate.read_bytes()).hexdigest() if candidate.is_file() else "",
              "run": {
                  "id": os.environ["RUN_ID"],
                  "attempt": os.environ["RUN_ATTEMPT"],
              },
              "robotOutcome": os.environ["ROBOT_OUTCOME"],
              "cleanupEvidence": "mandatory lifecycle gates and Robot teardown",
              "result": "passed" if os.environ["ROBOT_OUTCOME"] == "success" else "failed",
          }
          pathlib.Path("build/evidence/ci-cleanup-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload RCC Robot evidence and cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rcc-robot-evidence-${{ github.sha }}
          path: |
            build/evidence/candidate.json
            build/evidence/robot-gates.json
            build/evidence/robot/
            build/evidence/ci-cleanup-receipt.json
          if-no-files-found: warn
          retention-days: 90

  parity-evidence:
    name: Direct Go and RCC parity record
    if: always()
    needs: [test, integration, minio, locked-tools, packaging, rcc-local, rcc-test, rcc-robot]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record bounded parity evidence
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIRECT_TEST: ${{ needs.test.result }}
          DIRECT_INTEGRATION: ${{ needs.integration.result }}
          DIRECT_MINIO: ${{ needs.minio.result }}
          DIRECT_LOCKED_TOOLS: ${{ needs.locked-tools.result }}
          DIRECT_PACKAGING: ${{ needs.packaging.result }}
          RCC_LOCAL: ${{ needs.rcc-local.result }}
          RCC_TEST: ${{ needs.rcc-test.result }}
          RCC_ROBOT: ${{ needs.rcc-robot.result }}
        run: |
          mkdir -p build/evidence
          python3 - <<'PY'
          import json
          import os
          import pathlib

          direct = {
              "test": os.environ["DIRECT_TEST"],
              "integration": os.environ["DIRECT_INTEGRATION"],
              "minio": os.environ["DIRECT_MINIO"],
              "locked-tools": os.environ["DIRECT_LOCKED_TOOLS"],
              "packaging": os.environ["DIRECT_PACKAGING"],
          }
          rcc = {
              "local": os.environ["RCC_LOCAL"],
              "test": os.environ["RCC_TEST"],
              "robot": os.environ["RCC_ROBOT"],
          }
          complete = all(result == "success" for result in [*direct.values(), *rcc.values()])
          record = {
              "schemaVersion": 1,
              "candidateCommit": os.environ["CANDIDATE_COMMIT"],
              "run": {
                  "id": os.environ["RUN_ID"],
                  "attempt": os.environ["RUN_ATTEMPT"],
                  "url": os.environ["RUN_URL"],
              },
              "mandatoryGates": {"direct": direct, "rcc": rcc},
              "complete": complete,
              "requiredConsecutiveCompleteRuns": 2,
              "qualifiedHistoricalRuns": [],
          }
          pathlib.Path("build/evidence/parity.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rcc-parity-evidence-${{ github.sha }}
          path: build/evidence/parity.json
          if-no-files-found: error
          retention-days: 90
