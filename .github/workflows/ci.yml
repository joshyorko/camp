name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, race, vet, and vulnerability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race tests
        run: go test -race ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  integration:
    name: Credential-free integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./integration -count=1

  minio:
    name: Mandatory containerized MinIO
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove MinIO tests exist
        run: |
          tests="$(go test ./integration -list '^TestMinIO')"
          grep -q '^TestMinIO' <<<"$tests"
      - name: Run mandatory MinIO matrix
        run: go test -v ./integration -run '^TestMinIO' -count=1

  locked-tools:
    name: Pinned tool bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tools.lock.yaml and bootstrap behavior
        env:
          CAMP_TEST_REAL_TOOLS: "1"
        run: |
          tests="$(go test ./internal/adapters/tools -list '^TestInstallerCleanInstallsRealPinnedTools$')"
          grep -qx 'TestInstallerCleanInstallsRealPinnedTools' <<<"$tests"
          go test -v ./internal/adapters/tools -run '^TestInstallerCleanInstallsRealPinnedTools$' -count=1

  packaging:
    name: Reproducible packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./packaging -count=1
      - name: Build candidate artifacts
        env:
          VERSION: 0.0.0-${{ github.sha }}
          COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: "0"
          OUTPUT_DIR: dist
        run: ./packaging/build-archives.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-free-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  rcc-local:
    name: RCC local candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build exact RCC candidate
        run: ./developer/rccw run -r developer/toolkit.yaml --dev -t local
      - name: Stage candidate with preserved build root
        run: |
          mkdir -p ci-artifact/build/evidence
          install -m 0755 build/camp ci-artifact/build/camp
          cp build/evidence/candidate.json ci-artifact/build/evidence/candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rcc-candidate-${{ github.sha }}
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 14

  rcc-test:
    name: RCC source gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify pull request evidence receipt
        if: github.event_name == 'pull_request'
        run: python3 developer/verify_pr_receipt.py "$GITHUB_EVENT_PATH"
      - name: Run RCC source gates
        run: ./developer/rccw run -r developer/toolkit.yaml --dev -t test
      - name: Upload RCC source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rcc-source-evidence-${{ github.sha }}
          path: build/evidence/test-gates.json
          if-no-files-found: error
          retention-days: 30

  rcc-robot:
    name: RCC exact-candidate lifecycle evidence
    needs: rcc-local
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rcc-candidate-${{ github.sha }}
          path: .
      - name: Verify downloaded exact candidate
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          chmod +x build/camp
          python3 developer/ci_release_evidence.py verify-candidate \
            --build-root build \
            --commit "$CANDIDATE_COMMIT"
      - name: Authorize RCC pasta user namespace
        shell: bash
        run: |
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$restriction" ]] && [[ "$(cat "$restriction")" == "1" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true
      - name: Run mandatory exact-candidate Robot lifecycle
        id: robot
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: ./developer/rccw run -r developer/toolkit.yaml -t robot
      - name: Require mandatory RCC Robot evidence
        if: always()
        run: |
          test -f build/evidence/candidate.json
          test -f build/evidence/robot-gates.json
          test -f build/evidence/robot/output.xml
          test -f build/evidence/robot/log.html
          test -f build/evidence/robot/report.html
          test -f build/evidence/robot-cleanup.jsonl
          test -f build/evidence/ci-cleanup-receipt.json
      - name: Upload RCC Robot evidence and cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rcc-robot-evidence-${{ github.sha }}
          path: |
            build/evidence/candidate.json
            build/evidence/robot-gates.json
            build/evidence/robot/
            build/evidence/robot-cleanup.jsonl
            build/evidence/ci-cleanup-receipt.json
          if-no-files-found: error
          retention-days: 90

  parity-evidence:
    name: Direct Go and RCC parity record
    if: always()
    needs: [test, integration, minio, locked-tools, packaging, rcc-local, rcc-test, rcc-robot]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Record bounded parity evidence
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIRECT_TEST: ${{ needs.test.result }}
          DIRECT_INTEGRATION: ${{ needs.integration.result }}
          DIRECT_MINIO: ${{ needs.minio.result }}
          DIRECT_LOCKED_TOOLS: ${{ needs.locked-tools.result }}
          DIRECT_PACKAGING: ${{ needs.packaging.result }}
          RCC_LOCAL: ${{ needs.rcc-local.result }}
          RCC_TEST: ${{ needs.rcc-test.result }}
          RCC_ROBOT: ${{ needs.rcc-robot.result }}
        run: |
          python3 developer/ci_release_evidence.py write-parity \
            --output build/evidence/parity.json \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --run-url "$RUN_URL" \
            --direct "{\"test\":\"$DIRECT_TEST\",\"integration\":\"$DIRECT_INTEGRATION\",\"minio\":\"$DIRECT_MINIO\",\"locked-tools\":\"$DIRECT_LOCKED_TOOLS\",\"packaging\":\"$DIRECT_PACKAGING\"}" \
            --rcc "{\"local\":\"$RCC_LOCAL\",\"test\":\"$RCC_TEST\",\"robot\":\"$RCC_ROBOT\"}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rcc-parity-evidence-${{ github.sha }}
          path: build/evidence/parity.json
          if-no-files-found: error
          retention-days: 90
