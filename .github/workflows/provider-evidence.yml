name: Protected provider evidence

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      provider_profile:
        description: Authorized provider profile; no credentialed profile is claimed yet
        required: true
        default: not-configured
        type: choice
        options: [not-configured]

permissions:
  contents: read

concurrency:
  group: provider-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    environment: release-providers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Record explicitly gated provider evidence
        env:
          PROVIDER_PROFILE: ${{ inputs.provider_profile || 'not-configured' }}
        run: |
          mkdir -p evidence
          printf '{"commit":"%s","provider_profile":"%s","result":"gated","reason":"no credentialed provider profile is currently claimed or authorized"}\n' "$GITHUB_SHA" "$PROVIDER_PROFILE" > evidence/provider.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-evidence-${{ github.sha }}
          path: evidence/provider.json
          if-no-files-found: error
          retention-days: 90
