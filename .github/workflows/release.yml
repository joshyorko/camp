name: Release candidate and publication

on:
  workflow_dispatch:
    inputs:
      candidate_ci_run_id:
        description: Successful CI run containing mandatory exact-candidate lifecycle and parity evidence
        required: true
        type: string
      candidate_commit:
        description: Full commit SHA proven by the CI run
        required: true
        type: string
      candidate_sha256:
        description: Exact build/camp SHA-256 proven by the CI run
        required: true
        type: string
      version:
        description: Candidate version without a leading v
        required: true
        type: string
      publish:
        description: Publish after verification
        required: true
        default: false
        type: boolean
      claim_kubernetes_support:
        description: Require matching protected Kubernetes evidence for this candidate
        required: true
        default: false
        type: boolean
      kubernetes_evidence_run_id:
        description: Provider-evidence workflow run containing the exact candidate artifact
        required: false
        type: string
      kubernetes_candidate_sha256:
        description: Exact build/camp SHA-256 recorded by protected evidence
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  package:
    name: RCC release package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download and verify mandatory CI candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.candidate_ci_run_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          test "$CANDIDATE_COMMIT" = "$(git rev-parse HEAD)"
          run_json="$(mktemp)"
          jobs_json="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$run_json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" > "$jobs_json"
          python3 - "$run_json" "$jobs_json" <<'PY'
          import json
          import os
          import sys

          run = json.load(open(sys.argv[1], encoding="utf-8"))
          jobs = json.load(open(sys.argv[2], encoding="utf-8"))["jobs"]
          if run.get("head_sha") != os.environ["CANDIDATE_COMMIT"]:
              raise SystemExit("CI run does not prove the requested candidate commit")
          if run.get("conclusion") != "success" or run.get("path") != ".github/workflows/ci.yml":
              raise SystemExit("candidate CI workflow is not a successful authoritative CI run")
          conclusions = {job["name"]: job.get("conclusion") for job in jobs}
          for required in (
              "RCC exact-candidate lifecycle evidence",
              "Direct Go and RCC parity record",
          ):
              if conclusions.get(required) != "success":
                  raise SystemExit(f"mandatory CI job did not pass: {required}")
          PY
          gh run download "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "rcc-candidate-${CANDIDATE_COMMIT}" \
            --dir .
          python3 developer/ci_release_evidence.py verify-candidate \
            --build-root build \
            --commit "$CANDIDATE_COMMIT" \
            --sha256 "$CANDIDATE_SHA256"
      - name: Run RCC release packaging for verified candidate
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.candidate_commit }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          ./developer/rccw run -r developer/toolkit.yaml -t package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ inputs.candidate_commit }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Native verification (${{ matrix.architecture }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ inputs.candidate_commit }}
          path: dist
      - name: Verify downloaded checksums, SBOMs, and installed archives
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.candidate_commit }}
          VERIFY_ARCH: ${{ matrix.architecture }}
        run: |
          cd dist
          sha256sum --check checksums.txt
          cd ..
          ./packaging/build-release-evidence.sh verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-evidence-${{ matrix.architecture }}-${{ inputs.candidate_commit }}
          path: |
            dist/evidence.json
            dist/verification-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 90

  verified-artifacts:
    name: Seal verified artifact set
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ inputs.candidate_commit }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verified-release-evidence-*-${{ inputs.candidate_commit }}
          path: dist
          merge-multiple: true
      - name: Create immutable verified-artifact manifest
        run: python3 packaging/verified_artifacts.py create dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-set-${{ inputs.candidate_commit }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  kubernetes-evidence:
    name: Bind optional Kubernetes support claim
    needs: verified-artifacts
    if: inputs.claim_kubernetes_support == true
    environment: release-providers
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Download exact protected evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.kubernetes_evidence_run_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_SHA256: ${{ inputs.kubernetes_candidate_sha256 }}
          PROVIDER_WORKFLOW_NAME: "Protected Kubernetes provider evidence"
          PROVIDER_WORKFLOW_PATH: ".github/workflows/provider-evidence.yml"
          PROVIDER_EVIDENCE_JOB_NAME: "evidence"
          PROVIDER_EVIDENCE_ENVIRONMENT: "release-providers"
        run: |
          test -n "$RUN_ID"
          test -n "$CANDIDATE_COMMIT"
          test -n "$CANDIDATE_SHA256"
          run_json="$(mktemp)"
          jobs_json="$(mktemp)"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$PROVIDER_WORKFLOW_PATH" --jq .id)"
          test -n "$workflow_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$run_json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" > "$jobs_json"
          python3 scripts/kubernetes_evidence.py validate-provenance \
            --run "$run_json" \
            --jobs "$jobs_json" \
            --commit "$CANDIDATE_COMMIT" \
            --sha256 "$CANDIDATE_SHA256" \
            --workflow-id "$workflow_id" \
            --workflow-name "$PROVIDER_WORKFLOW_NAME" \
            --job-name "$PROVIDER_EVIDENCE_JOB_NAME" \
            --required-environment "$PROVIDER_EVIDENCE_ENVIRONMENT"
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "kubernetes-evidence-${CANDIDATE_COMMIT}" \
            --dir kubernetes-evidence
      - name: Reject stale or mismatched Kubernetes support evidence
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_SHA256: ${{ inputs.kubernetes_candidate_sha256 }}
        run: |
          test -n "$CANDIDATE_SHA256"
          relevant_change="$(git log -1 --format=%H -- \
            integration/kubernetes_lifecycle_test.go \
            integration/kubernetes_evidence_contract_test.go \
            internal/adapters/devpod \
            internal/adapters/lifecycle \
            tasks.py \
            scripts/kubernetes_evidence.py \
            .github/workflows/provider-evidence.yml)"
          python3 scripts/kubernetes_evidence.py validate \
            --directory kubernetes-evidence \
            --commit "$CANDIDATE_COMMIT" \
            --sha256 "$CANDIDATE_SHA256" \
            --relevant-change "$relevant_change" \
            --require-pass

  attest:
    needs: [verified-artifacts, kubernetes-evidence]
    if: >-
      always() &&
      needs.verified-artifacts.result == 'success' &&
      (inputs.claim_kubernetes_support != true || needs.kubernetes-evidence.result == 'success') &&
      inputs.publish == true
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-set-${{ inputs.candidate_commit }}
          path: dist
      - name: Recheck verified archives before attestation
        run: python3 packaging/verified_artifacts.py recheck dist
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/camp_*.tar.gz

  publish:
    needs: attest
    if: inputs.publish == true
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-set-${{ inputs.candidate_commit }}
          path: dist
      - name: Recheck verified archives before publication
        run: python3 packaging/verified_artifacts.py recheck dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="v${REQUESTED_VERSION#v}"
          fi
          python3 developer/ci_release_evidence.py fetch-verify-tag \
            --tag "$release_tag" \
            --candidate-commit "$CANDIDATE_COMMIT"
          gh release create "$release_tag" \
            dist/camp_*.tar.gz \
            dist/checksums.txt \
            dist/*.spdx.json \
            dist/camp.rb \
            dist/verified-artifacts.json \
            --verify-tag \
            --generate-notes
