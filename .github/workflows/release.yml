name: Release candidate and publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version without a leading v
        required: true
        type: string
      publish:
        description: Publish after verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: RCC release package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release evidence
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          ./developer/rccw run -r developer/toolkit.yaml -t package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Native verification (${{ matrix.architecture }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: dist
      - name: Verify downloaded checksums, SBOMs, and installed archives
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          COMMIT: ${{ github.sha }}
          VERIFY_ARCH: ${{ matrix.architecture }}
        run: |
          cd dist
          sha256sum --check checksums.txt
          cd ..
          ./packaging/build-release-evidence.sh verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-evidence-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            dist/evidence.json
            dist/verification-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 90

  verified-artifacts:
    name: Seal verified artifact set
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verified-release-evidence-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - name: Create immutable verified-artifact manifest
        run: python3 packaging/verified_artifacts.py create dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-set-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: verified-artifacts
    if: github.event_name == 'push' || inputs.publish == true
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-set-${{ github.sha }}
          path: dist
      - name: Recheck verified archives before attestation
        run: python3 packaging/verified_artifacts.py recheck dist
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/camp_*.tar.gz

  publish:
    needs: attest
    if: github.event_name == 'push' || inputs.publish == true
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-set-${{ github.sha }}
          path: dist
      - name: Recheck verified archives before publication
        run: python3 packaging/verified_artifacts.py recheck dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="v${REQUESTED_VERSION#v}"
          fi
          gh release create "$release_tag" \
            dist/camp_*.tar.gz \
            dist/checksums.txt \
            dist/*.spdx.json \
            dist/camp.rb \
            dist/verified-artifacts.json \
            --verify-tag \
            --generate-notes
